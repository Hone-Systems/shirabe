[project]
name = "shirabe"
version = "0.1.0"
description = "An inspectable experiment in scientific writing and citation impact"
requires-python = ">=3.11,<3.14"
license = "AGPL-3.0-only"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "numpy>=2,<3",
    "scikit-learn>=1.6,<2",
    "httpx>=0.28,<1",
    "pymupdf>=1.25,<2",
    "python-multipart>=0.0.20",
    "langdetect>=1.0.9",
    "onnxruntime>=1.20,<2",
    "tokenizers>=0.22,<0.23",
]
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
training = [
    "onnx>=1.17,<2",
    "safetensors>=0.5,<1",
    "torch==2.6.0",
    "transformers==4.57.6",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"shirabe/pdf_worker.py" = ["E402"]
